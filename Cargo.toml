[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/ingest",
    "crates/pricing",
    "crates/router",
    "crates/backtest",
    "crates/cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Solver Engine contributors"]

[workspace.dependencies]
# internal
solver-types     = { path = "crates/types" }
solver-ingest    = { path = "crates/ingest" }
solver-pricing   = { path = "crates/pricing" }
solver-router    = { path = "crates/router" }
solver-backtest  = { path = "crates/backtest" }

# common
anyhow            = "1"
thiserror         = "1"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tokio             = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "sync", "signal"] }
reqwest           = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
url               = "2"
chrono            = { version = "0.4", features = ["serde"] }
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap              = { version = "4", features = ["derive"] }
async-trait       = "0.1"
futures           = "0.3"
hex               = "0.4"
alloy-primitives       = { version = "0.8", features = ["serde"] }
alloy-sol-types        = { version = "0.8" }

[profile.dev]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
