<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>solver — digest</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #21262d;
    --fg: #e6edf3; --muted: #8b949e; --dim: #6e7681;
    --excl: #d29922; --margin: #388bfd; --fill: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header a { color: var(--margin); text-decoration: none; font-size: 12px; }
  header a:hover { text-decoration: underline; }
  header .spacer { margin-left: auto; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
  section {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 20px; margin-bottom: 16px;
  }
  h2 {
    margin: 16px 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  h2:first-child { margin-top: 0; }
  p { margin: 0 0 10px; }
  p:last-child { margin-bottom: 0; }
  ul { margin: 0; padding-left: 20px; }
  li { margin-bottom: 6px; }
  li.empty { color: var(--dim); list-style: none; margin-left: -20px; }
  code { background: #0d1117; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .asof { color: var(--dim); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>solver — digest</h1>
  <a href="/digest?window=24h">24h</a>
  <a href="/digest?window=7d">7d</a>
  <span class="spacer"></span>
  <a href="/about">about</a>
  <a href="/">← back to live flow</a>
</header>
<main>

<section>
{{BODY}}
<p class="asof">{{ASOF}}</p>
</section>

</main>
</body>
</html>
